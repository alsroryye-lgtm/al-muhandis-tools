<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدوات المهندس - Al-Muhandis Tools</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1rem; line-height: 1.5; }
        .status {
            display: inline-block;
            background-color: #059669;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛠️ تطبيق أدوات المهندس</h1>
        <p>مرحباً بك! تم تشغيل منصة أدوات المهندس بنجاح وهي جاهزة للتطوير والتثبيت كـ PWA.</p>
        <div class="status">🟢 النظام يعمل بنجاح</div>
    </div>
</body>
</html>
